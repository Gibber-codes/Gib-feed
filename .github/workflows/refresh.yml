name: Refresh feed and publish

on:
  schedule:
    - cron: "0 12 * * *"   # every day, 5 AM Colorado time
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull new videos and posts
        run: node tools/refresh.mjs
      - name: Save the new feed
        run: |
          git config user.name "gibberfeed-bot"
          git config user.email "gibberfeed-bot@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || git commit -m "Daily feed refresh [skip ci]"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
